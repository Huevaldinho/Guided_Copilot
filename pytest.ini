[pytest]
# Pytest configuration with Allure support
addopts = 
    -v
    --strict-markers
    --tb=short
    --alluredir=allure-results
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=85
    -p no:warnings

testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    bdd: Mark test as BDD scenario
    unit: Mark test as unit test
    integration: Mark test as integration test
    slow: Mark test as slow
    smoke: Mark test as smoke test
    critical: Critical functionality requiring high reliability
    defect: Tests created to address identified defects
    happy-path: Test for normal/happy path scenarios
    error-handling: Tests for error handling and edge cases
    data-integrity: Tests verifying data consistency
    crud: Tests for Create/Read/Update/Delete operations
    persistence: Tests for data persistence layer
    concurrency: Tests for concurrent access handling
    file-locking: Tests for file locking mechanisms
    validation: Tests for input validation
    health-check: Tests for health check endpoints
    monitoring: Tests for system monitoring capabilities
    degraded-mode: Tests for degraded mode behavior
    errors-endpoint: Tests for error endpoint functionality
    recovery: Tests for error recovery scenarios
    file-io: Tests for file input/output operations
    statistics: Tests for statistics collection
    retrieval: Tests for data retrieval operations
    notifications: Tests for notification system
    severity: Tests for error severity determination
    threshold: Tests for threshold detection
    initialization: Tests for component initialization
    logging: Tests for logging functionality
