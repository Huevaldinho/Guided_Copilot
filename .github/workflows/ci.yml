name: CI/CD - Test Execution & Allure Reporting

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

env:
  PYTHON_VERSION: '3.13'
  MIN_COVERAGE: 85
  NODE_VERSION: '18'

jobs:
  test-and-coverage:
    name: Run Tests & Validate Coverage
    runs-on: ubuntu-latest
    
    outputs:
      coverage: ${{ steps.coverage.outputs.coverage }}
      coverage-pass: ${{ steps.coverage.outputs.coverage_pass }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage and Allure
        continue-on-error: true
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --alluredir=allure-results \
            --cov=src \
            --cov-report=html \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=json

      - name: Extract coverage percentage
        id: coverage
        run: |
          COVERAGE=$(python -c "import json; data=json.load(open('coverage.json')); print(int(data['totals']['percent_covered']))")
          echo "Coverage: ${COVERAGE}%"
          echo "coverage=${COVERAGE}" >> $GITHUB_OUTPUT
          
          if [ "$COVERAGE" -ge "$MIN_COVERAGE" ]; then
            echo "coverage_pass=true" >> $GITHUB_OUTPUT
            echo "✅ Coverage PASSED: ${COVERAGE}% >= $MIN_COVERAGE%"
          else
            echo "coverage_pass=false" >> $GITHUB_OUTPUT
            echo "❌ Coverage FAILED: ${COVERAGE}% < $MIN_COVERAGE%"
          fi

      - name: Add Test Summary to Report
        if: always()
        run: |
          echo "### 📊 Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage | ${{ steps.coverage.outputs.coverage }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| Minimum Required | $MIN_COVERAGE% |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.coverage.outputs.coverage_pass }}" = "true" ]; then
            echo "| Status | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Status | ❌ FAILED |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report-${{ github.ref_name }}
          path: htmlcov/
          retention-days: 30

      - name: Upload coverage to CodeCov
        if: always()
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

      - name: Fail if coverage below threshold
        if: steps.coverage.outputs.coverage_pass == 'false'
        run: |
          echo "❌ COVERAGE CHECK FAILED"
          echo "Coverage: ${{ steps.coverage.outputs.coverage }}% is below threshold of $MIN_COVERAGE%"
          exit 1

  allure-report:
    name: Generate Allure Report
    needs: test-and-coverage
    runs-on: ubuntu-latest
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests for Allure
        continue-on-error: true
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --alluredir=allure-results

      - name: Setup Node.js for Allure CLI
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Allure Command Line
        run: npm install -g allure-commandline

      - name: Generate Allure Report
        continue-on-error: true
        run: |
          allure generate allure-results -o allure-report --clean

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: allure-report-${{ github.ref_name }}
          path: allure-report/
          retention-days: 30

      - name: Deploy Allure Report to GitHub Pages
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: allure/${{ github.ref_name }}

  deployment-gate:
    name: Deployment Quality Gate
    needs: test-and-coverage
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check Deployment Eligibility
        run: |
          echo "### 🚀 Deployment Quality Gate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Coverage:** ${{ needs.test-and-coverage.outputs.coverage }}%" >> $GITHUB_STEP_SUMMARY
          echo "**Threshold:** $MIN_COVERAGE%" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.test-and-coverage.outputs.coverage_pass }}" = "true" ]; then
            echo "✅ **Quality Gate: PASSED**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Deployment Eligible:" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Code meets coverage requirements" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ All tests passed successfully" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Ready for push/merge" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Quality Gate: FAILED**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Deployment Blocked:" >> $GITHUB_STEP_SUMMARY
            echo "- ❌ Coverage ${{ needs.test-and-coverage.outputs.coverage }}% < $MIN_COVERAGE%" >> $GITHUB_STEP_SUMMARY
            echo "- ❌ Cannot push to this branch" >> $GITHUB_STEP_SUMMARY
            echo "- 📝 Fix failures and increase coverage" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Block merge if coverage low
        if: needs.test-and-coverage.outputs.coverage_pass == 'false'
        run: |
          echo "❌ QUALITY GATE BLOCKED"
          echo "Coverage: ${{ needs.test-and-coverage.outputs.coverage }}% < $MIN_COVERAGE%"
          exit 1

  workflow-summary:
    name: Workflow Summary
    needs: [test-and-coverage, allure-report, deployment-gate]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Generate Final Report
        run: |
          echo "### 🎯 CI/CD Pipeline Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Author:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pipeline Results:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Test Execution: ${{ needs.test-and-coverage.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 Coverage: ${{ needs.test-and-coverage.outputs.coverage }}% (Required: $MIN_COVERAGE%)" >> $GITHUB_STEP_SUMMARY
          echo "- 📈 Allure Report: ${{ needs.allure-report.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- 🚀 Quality Gate: ${{ needs.deployment-gate.result }}" >> $GITHUB_STEP_SUMMARY

